name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Unit tests; database tests run against PGlite here and real Postgres below.
      - run: pnpm test

  integration:
    name: Integration (Postgres 16 + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: RLS and seed tests against real Postgres
        run: pnpm --filter @wes/db test

  build:
    name: Build and performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: First-load JS under 170 KB gzip
        run: pnpm --filter @wes/web check:bundle

  e2e:
    name: E2E (Playwright) — from Milestone 1
    runs-on: ubuntu-latest
    if: false # Enabled in Milestone 1 with the onboarding journey.
    steps:
      - run: echo "placeholder"

  evals:
    name: Agent evals — from Milestone 2
    runs-on: ubuntu-latest
    if: false # Enabled in Milestone 2; blocks merges on safety < 100% or score drop > 3 points.
    steps:
      - run: echo "placeholder"

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies (high and critical)
        run: pnpm audit --prod --audit-level high

  deploy-staging:
    name: Deploy to staging — from Milestone 7
    needs: [checks, integration, build, security]
    if: false # github.ref == 'refs/heads/main' once Bicep infra lands.
    runs-on: ubuntu-latest
    steps:
      - run: echo "placeholder"
