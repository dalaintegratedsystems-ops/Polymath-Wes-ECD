name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Unit tests; database tests run against PGlite here and real Postgres below.
      - run: pnpm test
      - name: Coverage gate (agent pipeline and API domain services, 80%)
        run: |
          pnpm --filter @wes/agent test:coverage
          pnpm --filter @wes/api test:coverage

  integration:
    name: Integration (Postgres 16 + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: RLS and seed tests against real Postgres
        run: pnpm --filter @wes/db test

  build:
    name: Build and performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: First-load JS under 170 KB gzip
        run: pnpm --filter @wes/web check:bundle

  e2e:
    name: E2E (Playwright, 360px Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @wes/web exec playwright install --with-deps chromium
      - run: pnpm --filter @wes/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  evals:
    name: Agent evals (safety must be 100%)
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Deterministic offline run: always on, fails on any safety regression or a >3 point drop.
      - name: Evals (offline)
        run: pnpm --filter @wes/agent evals
        env:
          WES_MODEL_MODE: offline
      # Live run with the real models and a model-graded rubric, only when the secret exists.
      - name: Evals (live Claude)
        if: env.ANTHROPIC_API_KEY != ''
        run: pnpm --filter @wes/agent evals --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: packages/agent/evals/results
          retention-days: 14

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI is free for organisations (the GitHub Action needs a licence there).
      - name: Scan history for secrets (gitleaks)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies (high and critical)
        run: pnpm audit --prod --audit-level high

  deploy-staging:
    name: Deploy to staging — from Milestone 7
    needs: [checks, integration, build, security]
    if: false # github.ref == 'refs/heads/main' once Bicep infra lands.
    runs-on: ubuntu-latest
    steps:
      - run: echo "placeholder"
