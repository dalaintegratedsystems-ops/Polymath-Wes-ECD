name: Build images and deploy

# Builds the web and API images on every push to main and publishes them to GitHub Container
# Registry (ghcr.io). If Azure is configured (repository variables AZURE_RESOURCE_GROUP,
# AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID), it then rolls the staging
# container apps to the new images. No long-lived Azure secrets: GitHub OIDC federation.

on:
  push:
    branches: [main]
    paths:
      ['apps/**', 'packages/**', 'knowledge/**', 'pnpm-lock.yaml', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/polymath-wes

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        run: echo "IMAGE=$(echo '${{ env.IMAGE_PREFIX }}-${{ matrix.app }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: true

  deploy-staging:
    name: Roll staging to the new images
    needs: images
    runs-on: ubuntu-latest
    if: vars.AZURE_RESOURCE_GROUP != ''
    environment: staging
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Update container apps
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          rg='${{ vars.AZURE_RESOURCE_GROUP }}'
          api=$(az containerapp list -g "$rg" --query "[?contains(name, '-api-')].name | [0]" -o tsv)
          web=$(az containerapp list -g "$rg" --query "[?contains(name, '-web-')].name | [0]" -o tsv)
          # The API's init container runs migrations before the new revision serves traffic.
          az containerapp update -g "$rg" -n "$api" \
            --image "ghcr.io/$owner/polymath-wes-api:${{ github.sha }}" \
            --set-env-vars "APP_VERSION=${{ github.sha }}" >/dev/null
          az containerapp update -g "$rg" -n "$web" \
            --image "ghcr.io/$owner/polymath-wes-web:${{ github.sha }}" >/dev/null
          echo "Staging: https://$(az containerapp show -g "$rg" -n "$web" --query properties.configuration.ingress.fqdn -o tsv)"
